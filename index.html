<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>制限トーク</title>
    <style>
        body {
            margin: 0;
            padding: 40px 20px;
            background: #fff8d9;
            color: #222;
            font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
            text-align: center;
        }

        main {
            max-width: 680px;
            margin: 80px auto;
            padding: 48px 28px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-bottom: 16px;
            font-size: 40px;
        }

        p {
            font-size: 18px;
            line-height: 1.8;
        }

        .label {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 18px;
            border-radius: 999px;
            background: #ffd51f;
            font-weight: bold;
        }

        footer {
            margin-top: 40px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <main>
        <h1>制限トーク</h1>
        <p>
            「制限トーク」は、会話の中に設定された禁止ワードを<br>
            音声認識で検出して楽しむトークゲームです。
        </p>
        <p>
            家族や友達、カップルなど、みんなでの会話を<br>
            いつもと少し違うゲームに変えて楽しめます。
        </p>
        <div class="label">iOSアプリ</div>

        <footer>© 2026 制限トーク</footer>
    </main>
</body>
</html>
